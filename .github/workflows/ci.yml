name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast feedback: every package's unit/DOM tests + TypeScript checks, on a
  # small Node matrix. Uses the root scripts (npm --prefix under the hood).
  unit:
    name: Unit + Types (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL (2025-04) and modern jsdom needs require(ESM), which
        # only exists in Node 20.19+/22.12+ — so we test 20, 22, and current 24.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm run install:all
      - run: npm test
      - run: npm run test:types

  # Real browsers are slower, so they run once in a separate job. We run inside
  # the official Playwright image, which already ships every browser and all
  # system dependencies — so we never run `playwright install --with-deps`
  # (whose apt step is flaky on the hosted runner's Microsoft repos). Node is
  # included in the image. Pin the tag to the @playwright/test version we use.
  browser:
    name: Browser (Chromium / Firefox / WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # GitHub sets HOME=/github/home (owned by pwuser) for container jobs, but the
    # job runs as root — Firefox refuses to launch unless $HOME is owned by the
    # current user. Point HOME at root's own home.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - run: npm run install:all
      # Ensure the browser binaries match the installed @playwright/test (no apt; the image
      # already provides the system libraries). `@playwright/test` is `^1.61.1`, so a package's
      # lockfile can resolve a NEWER 1.6.x than the pinned image (e.g. sanitize → 1.62.1) whose
      # browser builds aren't baked in — causing "Executable doesn't exist at
      # /ms-playwright/webkit-XXXX". Install for EVERY browser-testing package's own resolved
      # Playwright, so whatever each one pins is present. Same-version installs are no-ops.
      - name: Ensure browser binaries (per browser-testing package)
        run: |
          for pkg in framework router resource head action storage forms sanitize \
                     examples/task-board examples/admin examples/contacts; do
            npm --prefix "$pkg" exec -- playwright install chromium firefox webkit
          done
      - run: npm run test:browser
